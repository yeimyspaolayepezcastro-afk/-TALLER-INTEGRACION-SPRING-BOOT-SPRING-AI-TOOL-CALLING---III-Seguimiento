spring.application.name=spring-ai-toolcalling
server.port=8080

# Groq usa una API compatible con OpenAI.
# Define la variable de entorno GROQ_API_KEY antes de iniciar la aplicación.
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.2

# Mensajes útiles durante el desarrollo
logging.level.org.springframework.ai=INFO
